[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deriv-vol-lab"
version = "0.1.0"
description = "Research and analytics tools for Deriv Volatility Indices"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "duckdb>=1.2",
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
    "websockets>=13",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "scipy-stubs>=1.14",
    "httpx>=0.27",
]

[project.scripts]
deriv-vol-lab = "deriv_vol_lab.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deriv_vol_lab = ["api/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["deriv_vol_lab"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=deriv_vol_lab --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["deriv_vol_lab"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
