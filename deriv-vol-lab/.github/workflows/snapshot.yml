name: Scheduled analytics snapshot

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analytics-snapshot
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Fetch candles and write snapshot
        env:
          DERIV_APP_ID: ${{ vars.DERIV_APP_ID }}
          SNAPSHOT_PATH: snapshots/latest.json
          LOG_LEVEL: INFO
        run: python -m deriv_vol_lab ingest-snapshot --days 2 --seed 0
      - name: Publish new snapshot through the default branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update scheduled analytics snapshot"
            git push
          fi
