name: CI

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: deriv-vol-lab

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: deriv-vol-lab/pyproject.toml
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest
